<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a1410">
<title>Not found · Terrible Teddies</title>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
<!-- Vercel serves this, with a 404 status, for any address that is not the
     game, a legal page, the staff desk, an API route or a real file. Plain
     HTML and inline CSS only: the site's CSP allows no inline script. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(ellipse at top, #3a2a14 0%, #1a1410 55%, #120d0a 100%);
    color: #f5ead8; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 30rem; }
  .eyebrow { margin: 0; color: #fbbf24; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  h1 { margin: 8px 0 0; color: #fff; font-size: 40px; line-height: 1.1; font-weight: 800; }
  p.lede { margin: 16px 0 0; font-weight: 600; }
  a.home {
    display: inline-block; margin-top: 24px; padding: 12px 22px; border-radius: 12px;
    background: linear-gradient(#fcd34d, #f59e0b); color: #1a1410; font-weight: 800; text-decoration: none;
  }
  a.home:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  nav { margin-top: 24px; font-size: 14px; }
  nav a { color: #f5ead8; margin-right: 20px; text-underline-offset: 3px; }
  nav a:focus-visible { outline: 2px solid #fbbf24; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Error 404</p>
  <h1>Nothing behind this door.</h1>
  <p class="lede">That address isn't part of Terrible Teddies. It may have moved, or the link was typed wrong.</p>
  <a class="home" href="/">Back to the bar</a>
  <nav aria-label="Policies"><a href="/terms">Terms of use</a><a href="/privacy">Privacy</a></nav>
</main>
</body>
</html>
