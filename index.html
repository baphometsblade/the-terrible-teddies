<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1226" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Terrible Teddies - Card Battle Game</title>
    <meta name="description" content="Battle with naughty teddies in this addictive card game! Collect legendary cards, build powerful decks, and dominate the leaderboards." />
    <meta name="keywords" content="card game, teddy bear game, battle cards, collectible cards, free game" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Terrible Teddies - Card Battle Game" />
    <meta property="og:description" content="Battle with naughty teddies in this addictive card game!" />
    <meta property="og:image" content="/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Terrible Teddies - Card Battle Game" />
    <meta name="twitter:description" content="Battle with naughty teddies in this addictive card game!" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <style>
      body {
        margin: 0;
        padding: 0;
        background: #120c1c;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* The loader painted before the app's JS arrives. Restyled to match the
         BootScreen it cross-fades into (the bar backdrop, a brass-ringed bear
         with a turning arc, brass lettering), so first paint does not flash a
         different look. CSS only: the inline script below swaps in an error
         state built from these same class names, and changing the script
         would change its CSP hash (see csp.test.js). The app's fonts are not
         loaded yet, so the lettering uses the system's rounded face. */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #120c1c;
        background-image:
          radial-gradient(ellipse 70% 45% at 50% -5%, rgba(245, 158, 11, 0.16), transparent 70%),
          radial-gradient(ellipse 45% 35% at 0% 100%, rgba(236, 72, 153, 0.08), transparent 70%),
          radial-gradient(ellipse 45% 35% at 100% 90%, rgba(45, 212, 191, 0.06), transparent 70%),
          linear-gradient(180deg, #241a35 0%, #1a1226 45%, #120c1c 100%);
        z-index: 9999;
        transition: opacity 0.5s;
      }
      #initial-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 24px;
        color: #ece6f2;
        font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .loader-teddy {
        position: relative;
        display: grid;
        place-items: center;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        font-size: 40px;
        line-height: 1;
        border: 3px solid transparent;
        background:
          linear-gradient(#1a1226, #1a1226) padding-box,
          linear-gradient(145deg, #fef3c7 0%, #b45309 30%, #fde68a 55%, #78350f 80%, #fbbf24 100%) border-box;
        box-shadow: 0 0 48px rgba(245, 158, 11, 0.22);
      }
      .loader-teddy::after {
        content: "";
        position: absolute;
        inset: -13px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.07);
        border-top-color: #fbbf24;
        animation: loader-spin 1.6s linear infinite;
      }
      @keyframes loader-spin {
        to { transform: rotate(360deg); }
      }
      /* The failure card the script swaps in has the reload button: the arc
         stops there, since a turning arc says "still loading" and it isn't. */
      .loader-content:has(#loader-reload) .loader-teddy::after { display: none; }
      /* Sized to one line at phone widths (a gradient clipped to text that
         wraps stretches over both lines: one pale, one dark). */
      .loader-title {
        margin-top: 28px;
        font-size: clamp(20px, 6vw, 30px);
        white-space: nowrap;
        font-weight: 800;
        letter-spacing: -0.01em;
        background: linear-gradient(180deg, #fef3c7 0%, #fbbf24 48%, #d97706 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .loader-subtitle {
        font-size: 14px;
        color: #b6a8ca;
        margin-top: 8px;
      }
      .loader-reload-btn {
        margin-top: 18px;
        padding: 10px 24px;
        border-radius: 12px;
        border: none;
        font: inherit;
        font-weight: 800;
        color: #120c1c;
        background: linear-gradient(180deg, #fde68a 0%, #fbbf24 42%, #d97706 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.65),
          inset 0 -2px 0 rgba(124, 45, 18, 0.45),
          0 8px 20px -8px rgba(217, 119, 6, 0.7);
        cursor: pointer;
      }
      .loader-reload-btn:focus-visible {
        outline: 2px solid #fbbf24;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-teddy::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-content">
        <div class="loader-teddy">🧸</div>
        <div class="loader-title">Terrible Teddies</div>
        <div class="loader-subtitle">Loading your collection...</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Remove the loader only once React has actually rendered into #root —
      // and if the app never mounts (e.g. a fatal load error), surface a
      // refreshable message instead of leaving a blank screen.
      (function () {
        var loader = document.getElementById('initial-loader');
        var root = document.getElementById('root');
        var removed = false;
        function removeLoader() {
          if (removed || !loader) return;
          removed = true;
          loader.classList.add('fade-out');
          setTimeout(function () { loader.remove(); }, 500);
        }
        var poll = setInterval(function () {
          if (root && root.childElementCount > 0) {
            clearInterval(poll);
            removeLoader();
          }
        }, 100);
        setTimeout(function () {
          if (removed || (root && root.childElementCount > 0)) return;
          // Do NOT clear the poll here. A slow boot (congested mobile, a
          // stalled-then-resumed chunk) can mount React AFTER this fires;
          // killing the poll would leave the "Couldn't load" card covering a
          // working app forever. Leaving the poll running means a late mount
          // still triggers removeLoader(), which removes the whole loader —
          // error card included. The card is a hint with a reload option, not
          // a terminal state.
          var content = loader && loader.querySelector('.loader-content');
          if (content) {
            content.innerHTML =
              '<div class="loader-teddy">🧸</div>' +
              '<div class="loader-title">Couldn\'t load the game</div>' +
              '<div class="loader-subtitle">Please check your connection and refresh.</div>' +
              '<button id="loader-reload" class="loader-reload-btn">Reload</button>';
            // No inline onclick= attribute: a script-src CSP (with no
            // 'unsafe-inline') silently drops inline event-handler attributes,
            // which would leave this button dead in the one moment it matters
            // most — the app has already failed to load.
            var reloadBtn = document.getElementById('loader-reload');
            if (reloadBtn) reloadBtn.addEventListener('click', function () { location.reload(); });
          }
        }, 10000);
      })();
    </script>
  </body>
</html>
