# Applies new database migrations and redeploys Edge Functions to production
# Supabase on every merge to main, so database-backed PRs can auto-merge and
# go live without a manual step. The frontend itself is deployed by Vercel.
#
# Both jobs call scripts/deploy-supabase.sh — the same script used locally
# via `npm run deploy:supabase` — so the workflow and a laptop share one
# implementation. GitHub Actions on this account may be billing-locked; when
# it is, run the script locally (always --dry-run first).
#
# Migrations: only files newer than BASELINE are considered (everything up to
# it was applied by hand before this workflow existed, partly via
# bootstrap.sql). A file is applied once, matched by its name suffix against
# Supabase's migration history, through the Management API, which records it.
name: Deploy Supabase

on:
  push:
    branches: [ "main" ]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "scripts/deploy-supabase.sh"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once; queue them in merge order.
concurrency:
  group: supabase-production
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply new migrations
        run: bash scripts/deploy-supabase.sh --no-functions

  functions:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Functions
        run: bash scripts/deploy-supabase.sh --no-migrations
