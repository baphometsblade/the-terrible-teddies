# Source of truth for these checks is scripts/ci-local.sh (and `npm run ci:local`).
# Every job below calls that script with --step so a laptop and GitHub run the
# exact same commands. GitHub Actions on this account may be billing-locked;
# when it is, local CI is what must pass before merge. Leave this workflow in
# place — it will run again if Actions is unlocked.
#
# This workflow will do a clean installation of node dependencies, cache/restore
# them, build the source code and run tests across different versions of node.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel superseded runs on the same branch or pull-request ref, so a new
# push does not pile onto a still-running suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: neither job writes to the repo, comments on PRs, or
# publishes anything — they only check out, build, and test. Without this,
# GITHUB_TOKEN gets the (often broader) repository-default permission set.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # Node 18 reached end-of-life in April 2025 and is below the floor the
        # build toolchain (Vite 7) requires; the engines field enforces the same.
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: bash scripts/ci-local.sh --step install
    - run: bash scripts/ci-local.sh --no-install --step lint
    - run: bash scripts/ci-local.sh --no-install --step typecheck
    - run: bash scripts/ci-local.sh --no-install --step build
    - run: bash scripts/ci-local.sh --no-install --step unit

  e2e:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    - run: bash scripts/ci-local.sh --step install
    - name: Run e2e smoke tests
      run: bash scripts/ci-local.sh --no-install --step e2e

  # The e2e job above runs against `vite dev`, so a break that only shows in the
  # production bundle (minification, code-splitting, a stale CSP hash) ships
  # green. This job builds dist/ and runs the smoke spec against `vite preview`,
  # exercising the real build output at least once per PR.
  e2e-prod:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    - run: bash scripts/ci-local.sh --step install
    - name: Run smoke spec against the production preview
      run: bash scripts/ci-local.sh --no-install --step e2e-prod

  # A migration PostgreSQL refuses to apply is invisible to every other job
  # here: lint, build, vitest and playwright never execute SQL. A security
  # migration once shipped with a return-type change that Postgres rejects,
  # so the CLI's per-file transaction rolled back the REVOKEs that were the
  # point of the file — while the whole suite stayed green. This job replays
  # the migrations against a real Postgres and asserts the resulting grants.
  migrations:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Apply every migration and assert the security properties
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      run: bash scripts/ci-local.sh --step migrations

  # The production page a crawler meets: the SFW landing, its weight, and the
  # web-vitals budget in lighthouserc.json. Desktop, one run — mobile
  # throttling on a shared runner moves more than the budget does.
  lighthouse:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    - run: bash scripts/ci-local.sh --step install
    - name: Lighthouse against the preview
      run: bash scripts/ci-local.sh --no-install --step lighthouse
