# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least-privilege default: neither job writes to the repo, comments on PRs, or
# publishes anything — they only check out, build, and test. Without this,
# GITHUB_TOKEN gets the (often broader) repository-default permission set.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # Node 18 reached end-of-life in April 2025 and is below the floor the
        # build toolchain (Vite 7) requires; the engines field enforces the same.
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run build --if-present
    - run: npm test

  e2e:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    - run: npm ci
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    - name: Run e2e smoke tests
      run: npm run test:e2e

  # A migration PostgreSQL refuses to apply is invisible to every other job
  # here: lint, build, vitest and playwright never execute SQL. A security
  # migration once shipped with a return-type change that Postgres rejects,
  # so the CLI's per-file transaction rolled back the REVOKEs that were the
  # point of the file — while the whole suite stayed green. This job replays
  # the migrations against a real Postgres and asserts the resulting grants.
  migrations:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Apply every migration and assert the security properties
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      run: ./scripts/check-migrations.sh
