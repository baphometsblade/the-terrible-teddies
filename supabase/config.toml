# Supabase CLI configuration
# See: https://supabase.com/docs/guides/cli/config

[project]
id = "wqdrbywcktxgytkyqcco"
name = "terrible-teddies"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[functions]
verify_jwt = true

# Stripe calls this endpoint with a Stripe-Signature header and NO Supabase JWT.
# It authenticates via Stripe webhook signature verification instead, so the
# gateway-level JWT check must be disabled or every webhook is rejected (401)
# before our handler runs — which would silently break all gem fulfillment.
[functions.stripe-webhook]
verify_jwt = false

# CCBill posts NewSaleSuccess / Refund / Chargeback / Void with its own digest,
# not a Supabase JWT. The handler checks that digest (and CCBILL_WEBHOOK_IPS
# when set). The gateway JWT check would 401 every post before it ran.
[functions.ccbill-webhook]
verify_jwt = false

# Database webhooks POST here with the service role key as the bearer. The
# gateway check stays on so an anonymous call is rejected. send-push also
# compares that bearer, in constant time, to SUPABASE_SERVICE_ROLE_KEY, so a
# player's token or a forged role claim cannot send a ping even if the
# function is deployed with --no-verify-jwt.
[functions.send-push]
verify_jwt = true
